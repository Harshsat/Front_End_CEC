<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
     integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
     crossorigin="anonymous"></script>
     <title>Form</title>
     <style>
        body{
            background-color:azure
        }

     </style>
<body>
   <form class="bg-dark">
    <div class="container mt-4">
        <div class="">
        <h2  class="mb-3 text-primary">Student Registration</h2>
        </div>
        <div class="mb-3">
        <label class="form-label text-white pb-5" for="name">name</label>
        <input class="form-control" type="text" id="name" name="name">
        </div>
        <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="text" id="email" name="email" placeholder="example @gmail.com">
        </div>
        <div class="mb-3">
        <label  class="form-label" for="password">Password:</label>
        <input class="form-control" type="password" id="password" name="password" required/>
        </div>
        <div class="mb-3">
        <label class="form-label" for="department">Department</label>
        <select class="form-control">
            <option value="ise">ISE</option>
            <option value="cse">CSE</option>
            <option value="aiml">AIML</option>
            <option value="eee">EEE</option>
            <option value="me">ME</option>
        </select>
        </div>
        <div class="mb-3">
        <h5 class="mb-2 text-dark">Choose the gender</h5>
        <label  class="form-label" for="male">Male</label>
        <input  type="radio" id="male" name="gender" value="male"/>
        <label  class="form-label" for="femlae">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <label  class="form-label" for="others">Others</label>
        <input  type="radio" id="male" name="gender" value="others"> 
        </div>
        <div class="mb-3">
        <label  class="form-label" for="date">Date:</label>
        <input class="form-control" type="date" id="date" name="date" required/>
        </div>
        <div class="mb-3">
        <label for="video">upload video</label>
        <input type="file" name="video" id="video" accept="video/*"><br><br>
        <label for="pdf">upload pdf</label>
        <input type="file" name="pdf" id="pdf" accept="application/pdf"><br><br>
        <label for="doc">upload Document</label>
        <input type="file" name="doc" id="doc" accept="application/doc">
        </div>
        <div class="mb-3 text-dark">
           <textarea>discription</textarea>
        </div>
        <div>
            <button class="btn btn-success">Submit</button>
            <button class="btn btn-outline-warning">Reset</button>
        </div>

    </div>
   </form>
</body>
</html>
