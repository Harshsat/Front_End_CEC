    <style>

            border: 5px;
            margin: 15px;

            padding: 20px;
            width: 800px;
            height: 500px;
        }

    </style>
</head>
<body>
    <h2>CSS Box Model</h2>
    <div class="box">
        <img style="width: 100px;height:100px" src="../day_1/images/photo-1517248135467-4c7edcad34c4.jpg">
        <h2>Foodies heaven</h2>
        <p>welcome to our restaurant, where food meets foodies </p>
    </div>
    <div class="vid">
       <video controls>
        <source
         src="../day_1/images/restvid.mp4"
         type="video/mp4" width="15px" height="15px"
         />
    </video>
    <h2>welcome to our restaurant</h2>
    </div>

    src="../day2/forms.html"

    >
