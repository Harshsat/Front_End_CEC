    <h1 style="text-align: center; background-color:rgb(95, 99, 99);font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif">Basic Form</h1>
    <form action="/submit" method="POST">
        <div class="haha">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required/><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required/><br><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male"/>

        </div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required/><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required/><br><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male"/>
        <label for="femlae">Female</label>
        <input type="radio" id="female" name="gender" value="female">  
        <label for="others">Others</label>
        <input type="radio" id="ot" name="gender" value="others"/><br><br>  
        <h3>Terms and conditions</h3>
        <label>
        <input type="checkbox" name="terms" required/>
        I agree to the Terms and conditions</label><br><br>
        <label class="pass" for="department">department</label>
        <select id="department" name="department">
            <option value="ise">ISE</option>
            <option value="cse">CSE</option>
            <option value="aiml">AIML</option>
            <option value="eee">EEE</option>
            <option value="me">ME</option>
        </select><br><br>
        <label class="pass" for="password">Password:</label>
        <input type="password" id="password" name="password" required/><br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required/><br><br>
        <textarea for="discription">discription:</textarea><br><br>
        <label for="video">upload video</label>
        <input type="file" name="video" id="video" accept="video/*"><br><br>
        <label for="pdf">upload pdf</label>
        <input type="file" name="pdf" id="pdf" accept="application/pdf"><br><br>
        <label for="doc">upload Document</label>
        <input type="file" name="doc" id="doc" accept="application/doc"><br><br>
        <label for="rating">Give your rating</label>
        <input type="range" name="range" id="range" min="0" max="100"/><br><br>
        <label for="color">colour</label>
        <input type="color" name="color" id="color"/><br><br>
        <input type="submit" value="submit"/><br><br>
        <button type="reset">Reset</button>
    </form>
