<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ES6 Features</h1>
    <p id="demo"></p>
    <script>
        // let n const
        let name="Alice";
        const pi=3.1416;
        console.log(name,pi);
        //temp litarals
        let age=26;
        let greeting=`hello ,${name},you are ${age} years old`
        console.log(greeting);
        //default parameters
        const multiply=(a,b=2)=>a*b;
        console.log("multiply",multiply(5));
        //destructing array
        const numbers=[10,20,30];
        const[x,y,z]=numbers;
        console.log("destructed:",x,y,z);
        //destructing obj
        const person={
            fname:"bob",city:"ny"};
            const{fname,city}=person;
            console.log("obj destructed:",fname,city);
        //spread operator
        const arr1=[1,2];
        const arr2=[3,4];
        const combined=[...arr1,...arr2];
        console.log("combined array:",combined);
        //arrow function
        const add=(a,b)=>a+b;
        console.log("arrow add:",add(5,10));
        document.getElementById("demo").innerText=greeting
        
    </script>
</body>
</html>
